<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827"><title>我的项目看板</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111827'/%3E%3Cpath d='M18 43V23h7v14h20v6H18zm13-10V18h7v15h-7zm13 0V25h7v8h-7z' fill='%237cfaad'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#182233;--muted:#64748b;--paper:#f6f7fb;--card:#fff;--line:#e7eaf0;--lime:#77e7a1;--navy:#111827;--red:#dc5961;--amber:#e6a63e}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1240px;margin:auto;padding:28px 22px 60px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:28px}.eyebrow{color:#738197;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}.top h1{margin:0;font-size:clamp(1.7rem,4vw,2.55rem);letter-spacing:-.05em}.date{color:var(--muted);margin:7px 0 0}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-weight:650;color:var(--ink);box-shadow:0 1px 1px #18223308}.button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.button:hover{transform:translateY(-1px)}.focus{background:linear-gradient(120deg,#111827,#243552);color:#fff;border-radius:18px;padding:20px 22px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;margin-bottom:24px}.focus-mark{background:var(--lime);color:#0e3422;width:43px;height:43px;display:grid;place-items:center;border-radius:12px;font-size:1.3rem}.focus small{color:#b8c4d6}.focus strong{display:block;font-size:1.08rem;margin-top:2px}.focus .button{color:var(--navy);border:0;background:var(--lime);white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.metric span{display:block;color:var(--muted);font-size:.82rem}.metric b{font-size:1.55rem;letter-spacing:-.04em}.section-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 13px}.section-head h2{font-size:1.08rem;margin:0}.section-head span{font-size:.85rem;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.project{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:286px;display:flex;flex-direction:column}.card-top{display:flex;gap:11px;align-items:center}.emoji{width:39px;height:39px;display:grid;place-items:center;background:#eef8f2;border-radius:11px;font-size:1.25rem}.project h3{margin:0;font-size:1.05rem;letter-spacing:-.02em}.badge{font-size:.75rem;padding:4px 8px;border-radius:30px;margin-left:auto;background:#edf7ef;color:#267448;font-weight:700}.badge.plan{background:#f0f3f7;color:#637086}.progressline{height:7px;background:#ecf0f4;border-radius:99px;margin:20px 0 8px;overflow:hidden}.progressline i{display:block;height:100%;background:linear-gradient(90deg,#63d994,#9df0bb);border-radius:inherit}.progress-meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}.next{margin:18px 0 10px;font-size:.93rem}.next b{font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;color:#778499;display:block;margin-bottom:3px}.deadline{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:.82rem}.risk{color:var(--red);font-weight:700}.normal{color:var(--muted)}.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.milestone{display:grid;grid-template-columns:36px 1fr auto auto;align-items:center;gap:12px;padding:14px 17px;border-bottom:1px solid var(--line)}.milestone:last-child{border:0}.check{width:22px;height:22px;border:1.5px solid #c4ccd7;border-radius:50%;background:white;color:white;font-size:.78rem}.check.done{background:#52ca82;border-color:#52ca82}.milestone small{color:var(--muted)}.milestone time{font-size:.84rem;color:var(--muted)}.empty{padding:24px;color:var(--muted);text-align:center}.idea-compose{display:grid;grid-template-columns:1fr auto;gap:10px;background:#eef2f8;border:1px solid #e2e7ef;padding:12px;border-radius:14px}.idea-compose input,.search{width:100%;border:1px solid #dfe4eb;border-radius:9px;padding:10px;background:#fff;color:var(--ink)}.idea-tools{display:flex;gap:10px;margin:12px 0}.idea-card{padding:14px 17px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px}.idea-card:last-child{border:0}.idea-card p{margin:3px 0 0;color:var(--muted);font-size:.88rem}.idea-card small{color:#778499}.idea-actions{display:flex;align-items:center;gap:7px}.modal{position:fixed;inset:0;background:#11182799;z-index:4;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{max-height:93vh;overflow:auto;width:min(660px,100%);background:#fff;border-radius:18px;padding:22px;box-shadow:0 20px 60px #0004}.dialog h2{margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:5px;font-size:.82rem;font-weight:700;color:#526176}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid #dfe4eb;border-radius:9px;padding:10px;color:var(--ink);font-weight:400;background:#fff}.field textarea{min-height:76px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 15px;border-radius:10px;font-size:.9rem;display:none;z-index:8}.toast.show{display:block}.guide{font-size:.88rem;color:var(--muted);padding:14px 0 0}.guide code{background:#e9edf2;padding:2px 4px;border-radius:4px;color:#39475a}@media(max-width:760px){.app{padding:20px 14px 44px}.top{display:block}.actions{justify-content:flex-start;margin-top:16px}.focus{grid-template-columns:auto 1fr;padding:17px}.focus .button{grid-column:1/-1;width:100%}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.milestone{grid-template-columns:30px 1fr auto}.milestone button{grid-column:2}.milestone time{grid-column:3;grid-row:1}.idea-compose{grid-template-columns:1fr}.idea-card{grid-template-columns:1fr}.idea-actions{justify-content:flex-end}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body><main class="app"><header class="top"><div><p class="eyebrow">Personal Operating System</p><h1>我的项目看板</h1><p class="date" id="today"></p></div><div class="actions"><button class="button" id="exportBtn">导出备份</button><label class="button">导入备份<input id="importInput" type="file" accept="application/json" hidden></label><button class="button primary" id="addBtn">＋ 新建项目</button></div></header><section class="focus" id="focus"></section><section class="metrics" id="metrics"></section><div class="section-head"><h2>项目概览</h2><span>每个项目只保留一个下一步</span></div><section class="grid" id="projects"></section><div class="section-head"><h2>里程碑与截止提醒</h2><span>勾掉一个，再推进一个</span></div><section class="list" id="milestones"></section><p class="guide">Git 使用方式：点击“导出备份”后替换 <code>dist/data/board.json</code>，再提交即可留存完整版本历史；打开看板时也可直接导入该文件。</p></main><div class="modal" id="modal"><form class="dialog" id="projectForm"><h2 id="formTitle">新建项目</h2><input type="hidden" name="id"><div class="form-grid"><label class="field"><span>项目名称</span><input name="name" required placeholder="例如：剧本杀顾客 CRM"></label><label class="field"><span>图标</span><input name="emoji" maxlength="4" value="✦"></label><label class="field"><span>状态</span><select name="status"><option>进行中</option><option>规划中</option><option>已暂停</option><option>已完成</option></select></label><label class="field"><span>当前进度（0–100）</span><input name="progress" type="number" min="0" max="100" value="0"></label><label class="field"><span>最近截止日</span><input name="deadline" type="date"></label><label class="field full"><span>唯一的下一步</span><input name="next" required placeholder="可在 30–60 分钟内启动的动作"></label><label class="field full"><span>备注 / 当前判断</span><textarea name="note" placeholder="不做什么、先验证什么…"></textarea></label></div><div class="dialog-actions"><button type="button" class="button" id="cancel">取消</button><button class="button primary">保存项目</button></div></form></div><div class="toast" id="toast"></div>
<script>
const KEY='personal-project-board-v1';let state={projects:[],ideas:[]};const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=d=>{let x=new Date(d+'T12:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.round((x-n)/86400000)};const fmt=d=>new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric'}).format(new Date(d+'T12:00:00'));
async function init(){let saved=localStorage.getItem(KEY);if(saved){state=JSON.parse(saved)}else{state=await fetch('data/board.json').then(r=>r.json())}render()}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function dueText(d){if(!d)return '未设截止日';let x=day(d);return x<0?'已逾期 '+Math.abs(x)+' 天':x===0?'今天到期':x<=3?'还剩 '+x+' 天':fmt(d)}function risk(d){let x=day(d);return x<=3?'risk':'normal'}
function render(){state.ideas=state.ideas||[];let ps=state.projects;$('#today').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());let all=ps.flatMap(p=>p.milestones.map((m,index)=>({...m,p,index}))).sort((a,b)=>a.date.localeCompare(b.date));let urgent=all.filter(m=>!m.done&&day(m.date)<=3).sort((a,b)=>a.date.localeCompare(b.date))[0];$('#focus').innerHTML=urgent?`<div class="focus-mark">!</div><div><small>现在最需要推进</small><strong>${esc(urgent.p.name)} · ${esc(urgent.title)}</strong><small>${dueText(urgent.date)}，完成它会让项目继续前进。</small></div><button class="button" onclick="toggleMilestone('${urgent.p.id}',${urgent.index})">标记完成</button>`:`<div class="focus-mark">✓</div><div><small>节奏良好</small><strong>眼前没有临期里程碑</strong><small>把下一个重要节点定下来，保持清晰的推进感。</small></div>`;let overdue=all.filter(m=>!m.done&&day(m.date)<0).length, active=ps.filter(p=>p.status==='进行中').length, avg=ps.length?Math.round(ps.reduce((n,p)=>n+Number(p.progress),0)/ps.length):0;$('#metrics').innerHTML=`<div class="metric"><span>全部项目</span><b>${ps.length}</b></div><div class="metric"><span>正在推进</span><b>${active}</b></div><div class="metric"><span>平均进度</span><b>${avg}%</b></div><div class="metric"><span>已逾期节点</span><b style="color:${overdue?'var(--red)':'var(--ink)'}">${overdue}</b></div>`;$('#projects').innerHTML=ps.map(p=>`<article class="project"><div class="card-top"><div class="emoji">${esc(p.emoji)}</div><h3>${esc(p.name)}</h3><span class="badge ${p.status==='规划中'?'plan':''}">${esc(p.status)}</span></div><div class="progressline"><i style="width:${p.progress}%"></i></div><div class="progress-meta"><span>当前进度</span><b>${p.progress}%</b></div><p class="next"><b>下一步</b>${esc(p.next)}</p><div class="deadline"><span class="${risk(p.deadline)}">${dueText(p.deadline)}</span><button class="button" onclick="editProject('${p.id}')">编辑</button></div></article>`).join('')||'<div class="empty">还没有项目。先新建一个最想推进的项目。</div>';renderIdeas();$('#milestones').innerHTML=all.length?all.map(m=>`<div class="milestone"><button aria-label="切换完成状态" class="check ${m.done?'done':''}" onclick="toggleMilestone('${m.p.id}',${m.index})">${m.done?'✓':''}</button><div><b>${esc(m.title)}</b><small> · ${esc(m.p.name)}</small></div><time class="${m.done?'normal':risk(m.date)}">${m.done?'已完成':dueText(m.date)}</time><button class="button" onclick="addMilestone('${m.p.id}')">添加节点</button></div>`).join(''):'<div class="empty">新建项目后，为它定下第一个里程碑。</div>'}function renderIdeas(){let q=($('#ideaSearch')?.value||'').trim().toLowerCase(),ideas=state.ideas.filter(i=>(i.text+' '+i.status).toLowerCase().includes(q));$('#ideas').innerHTML=ideas.length?ideas.map(i=>`<div class="idea-card"><div><b>${esc(i.text)}</b><p><small>${esc(i.status)} · ${new Date(i.createdAt).toLocaleDateString('zh-CN')}</small></p></div><div class="idea-actions"><button class="button" onclick="promoteIdea('${i.id}')">立项</button><button class="button" onclick="deleteIdea('${i.id}')">删除</button></div></div>`).join(''):`<div class="empty">${q?'没有找到匹配的需求。':'需求池为空。把突然冒出的想法放在这里，继续做眼前最重要的事。'}</div>`}
window.toggleMilestone=(id,i)=>{let p=state.projects.find(x=>x.id===id);p.milestones[i].done=!p.milestones[i].done;save();toast(p.milestones[i].done?'里程碑已完成':'已重新打开该里程碑')};window.editProject=id=>openForm(state.projects.find(p=>p.id===id));window.addMilestone=id=>{let title=prompt('里程碑名称');if(!title)return;let date=prompt('截止日期（YYYY-MM-DD）',new Date().toISOString().slice(0,10));if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')){toast('日期格式不正确');return}state.projects.find(p=>p.id===id).milestones.push({title,date,done:false});save();toast('里程碑已添加')};window.deleteIdea=id=>{state.ideas=state.ideas.filter(i=>i.id!==id);save();toast('需求已删除')};window.promoteIdea=id=>{let idea=state.ideas.find(i=>i.id===id);if(!idea)return;state.ideas=state.ideas.filter(i=>i.id!==id);openForm({name:idea.text,emoji:'✦',status:'规划中',progress:0,deadline:'',next:'明确要验证的问题',note:'来自需求池'});save();toast('已转为待立项项目，请补全信息')};function openForm(p){let f=$('#projectForm');f.reset();if(p)Object.entries(p).forEach(([k,v])=>{if(f.elements[k]&&k!=='milestones')f.elements[k].value=v});f.elements.id.value=p?.id||'';$('#formTitle').textContent=p?.id?'编辑项目':'新建项目';$('#modal').classList.add('open')}$('#addBtn').onclick=()=>openForm();$('#cancel').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};$('#projectForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.progress=Math.max(0,Math.min(100,Number(d.progress)));let old=state.projects.find(p=>p.id===d.id);if(old)Object.assign(old,d);else state.projects.push({...d,id:crypto.randomUUID(),milestones:[]});$('#modal').classList.remove('open');save();toast('项目已保存')};function collectIdea(){let text=$('#ideaInput').value.trim();if(!text)return;state.ideas.unshift({id:crypto.randomUUID(),text,status:'待判断',createdAt:new Date().toISOString()});$('#ideaInput').value='';save();toast('已放入需求池')};$('#addIdea').onclick=collectIdea;$('#ideaInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();collectIdea()}};$('#ideaSearch').oninput=renderIdeas;$('#exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='board-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('备份已导出')};$('#importInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.projects))throw Error();state=d;save();toast('备份已导入')}catch{toast('这不是有效的看板备份文件')}};r.readAsText(f);e.target.value=''};init();
</script></body></html>
